name: Publish dev build

on:
  push:
    branches: [main, "claude/**"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The layout tests (tests/hub-layout.test.js) draw the Hub in real Chromium. Without a browser they used to SKIP silently (4 skipped tests in every CI run),
      # so the hostile-CSS layout matrix only ever ran in the cloud workspace. Install the browser and make a missing one a failure, not a skip.
      - name: Install Chromium for the layout tests
        run: npx playwright install --with-deps chromium
      - name: Run tests
        run: npm test
        env:
          REQUIRE_CHROMIUM: "1"
      - name: Build compendium packs
        run: npm run build:packs
      - name: Build module zip
        run: zip -r module.zip module.json scripts styles packs README.md
      # The real-Foundry e2e runner (private repo foundry-e2e-kit) deploys THIS exact build, named by commit, and never builds anything itself.
      - name: Record the build's checksum
        run: sha256sum module.zip > module.zip.sha256
      - name: Keep the exact build as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: module-${{ github.sha }}
          path: |
            module.zip
            module.zip.sha256
            module.json
          retention-days: 30
      - name: Publish rolling "dev" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: Dev build
          prerelease: true
          files: |
            module.json
            module.zip
