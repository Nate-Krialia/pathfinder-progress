name: Publish dev build

on:
  push:
    branches: [main, "claude/**"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run tests
        run: npm test
      - name: Build compendium packs
        run: npm run build:packs
      - name: Build module zip
        run: zip -r module.zip module.json scripts styles packs README.md
      - name: Publish rolling "dev" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: Dev build
          prerelease: true
          files: |
            module.json
            module.zip
